# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# `mise run licenses`, `mise run advisories` and `mise run bans` each run one of
# these checks, and CI runs all three as separate jobs, so a failure names the
# check that failed instead of arriving as one aggregate error.
#
# `cargo deny check bans` is the graph-level half of dependency hygiene;
# clippy's `cargo` lint group is the source-level half, catching a wildcard
# requirement or missing crate metadata before it is ever resolved.

[graph]
all-features = true

[licenses]
version = 2
# Licences observed across the dependency graph. Anything not listed — copyleft,
# proprietary, unknown — fails the check and has to be reviewed before it is
# added, rather than waved through by a wildcard entry.
allow = [
    # This crate's own licence, which the check also evaluates.
    "GPL-2.0-only",
    # ryu and xxhash-rust.
    "BSL-1.0",
    # The bulk of the graph.
    "MIT",
    # dunce and aws-lc-sys.
    "MIT-0",
    "Apache-2.0",
    # wasi, wasip2 and wit-bindgen, on wasm targets.
    "Apache-2.0 WITH LLVM-exception",
    # aws-lc-sys, ran and subtle.
    "BSD-3-Clause",
    # unicode-ident, plus the ICU crates that share this licence.
    "Unicode-3.0",
    # memchr, walkdir, same-file, winapi-util, aho-corasick and the jiff crates.
    "Unlicense",
    "CC0-1.0",
    # foldhash through hashbrown, miniz_oxide through flate2, and the objc2
    # crates on Apple targets. Zlib is OSI approved and FSF Free/Libre, so it is
    # compatible with GPL-2.0-only. Each comment names the crate that pulls it,
    # so the next person to read this knows where the obligation came from.
    "Zlib",
    # ISC, recorded by the TLS stack: `rustls`, `rustls-webpki`,
    # `rustls-native-certs`, `hyper-rustls`, `untrusted`, `aws-lc-rs` and
    # `aws-lc-sys`. The OTLP exporter and the S3 transport use them for
    # `https://`. Plain `http://` still works.
    #
    # ISC is permissive, it is on the FSF's own list of licences compatible with
    # the GPL, and it is what the Rust project itself uses. One entry is enough
    # for all of these crates: `aws-lc-rs` and `aws-lc-sys` also allow
    # `Apache-2.0`, and that entry is already above.
    #
    # **`webpki-roots` is deliberately absent, and that is a decision rather than
    # an omission.** TLS uses the operating system trust store, not a
    # compiled-in Mozilla bundle. Nothing in the graph pulls `webpki-roots`.
    #
    # `webpki-root-certs` is a different crate with the same licence family:
    # `reqwest` 0.13 reaches it through `rustls-platform-verifier`, which still
    # prefers the operating system store and keeps the bundled roots as a
    # fallback for platforms that have no verifier. `CDLA-Permissive-2.0` is a
    # permissive data licence, so it is allowed here.
    "CDLA-Permissive-2.0",
    "ISC",
]
# Some crates ship licence text without an SPDX expression. The threshold is
# 0.9 rather than the usual 0.8, so an unrecognised licence gets a second look.
confidence-threshold = 0.9

[bans]
# Warn rather than fail on duplicate versions. Several transitive dependencies
# ship more than one version of a shared crate, and collapsing those is not
# worth the effort at this size. The count is still reported, so a regression
# is visible.
multiple-versions = "warn"
# A wildcard requirement resolves to whatever is newest at install time, which
# is not a reviewable decision and can change without a commit.
wildcards = "deny"
allow-wildcard-paths = false
# rustc's `unused_crate_dependencies` lint is per target, and this package shares
# one `[dependencies]` list across its library, its binary, its four test
# binaries and its bench. Each target therefore reports dependencies that only
# another target uses as unused. cargo-deny 0.20 has no unused-crate check:
# `[bans]` has no such key, and adding one fails to deserialize. `clippy::cargo`
# checks manifest hygiene, not dependency use. A dedicated tool is the answer,
# and that is a decision about the toolchain rather than about this file.
# Recorded here so the next person who greps `deny.toml` for "unused" learns it
# rather than rediscovering it.

[advisories]
version = 2
# Denied rather than warned: a yanked release is one whose author has asked for
# it not to be used, and a gateway that stores object data has no business
# resolving to one. This is stricter than a warn default on purpose.
yanked = "deny"

# Each ignore entry names a single advisory id, so every other advisory still
# gates. Delete an entry when the dependency moves past the vulnerable range;
# `cargo deny check advisories` reports the stale entry when it does.
ignore = [
    # RUSTSEC-2026-0387 (Low/Medium): timing variability in crypto-bigint's
    # constant-time operations. Reached only through aws-sigv4's `sigv4a`
    # feature (asymmetric SigV4a signing), which s3s-aws enables and which
    # tele-s3 never uses: authentication is symmetric SigV4 via SimpleAuth.
    # The vulnerable p256 path is compiled into the test binaries and never
    # executed. No upgrade is available in the 1.x aws-sdk-s3 line, and
    # pulling sigv4a out of s3s-aws would break the integration-test client.
    "RUSTSEC-2026-0387",
]

[sources]
# Denied rather than warned. The lockfile is what makes a build reproducible, so
# a registry or git source that is not the expected one has to be a deliberate,
# recorded decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
